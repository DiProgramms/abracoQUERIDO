{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Cadastramento</title>
        
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
              crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'css/projetoAmigoCSS.css' %}" type="text/css">
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width device-width, initial-scale=1.0">

        <script src="{% static 'js/input_cadastro.js' %}"></script>
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" 
    crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js" 
    crossorigin="anonymous"></script>
        <style>
            body,html{          

                height: 100%;
                margin: 0;
                padding: 0;

            }
        </style>
        <style>
            .page-container{
                display: flex;
                align-items: center;
                justify-content: center;
                height: 160vh;
            }
        </style>

    </head>
    <body class="corPADRAO">
    <div class="page-container">
        <div class="row justify-content-center">
            <div>
                <form class="px-4 py-3" method="POST">
                    {% csrf_token %}
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="username">Usuário:</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="password">Senha:</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>
                    <hr>
                    <div class="form-row">
                        <div class="form-group col-md-4">
                            <label for="name">Nome:</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="cpf">CPF:</label>
                            <input type="text" class="form-control" id="cpf" name="cpf" required>
                        </div>
                        <div class="form-group col-md-4">
                            <label for="birthdate">Data de Nascimento:</label>
                            <input type="date" class="form-control" id="birthdate" name="birthdate" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-lg-12">
                            <label for="email">Email:</label>
                            <input type="text" class="form-control" id="email" name="email" required>
                        </div>
                    </div>
                    <hr>
                    <div class="form-group">
                        <label for="city">Cidade:</label>
                        <input type="text" class="form-control" id="city" name="city" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Endereço:</label>
                        <input type="text" class="form-control" id="address" name="address" required>
                    </div>
                    <hr>
                    <div class="form-group">
                        <label for="crp">CRP:</label>
                        <input type="text" class="form-control" id="crp" name="crp" required>
                    </div>
                    <div class="form-group">
                        <label for="status">Status:</label>
                        <select name="status" id="status">
                            <option value="ativo">Ativo</option>
                            <option value="desativado">Desativado</option>
                        </select>
                    </div>
                    <hr>
                    <div class="form-group">
                        <label for="instituicao">Instituição:</label>
                        <input type="text" class="form-control" id="instituicao" name="instituicao" required>
                    </div>
                    <div class="form-group">
                        <label for="tipo">Tipo:</label>
                        <input type="text" class="form-control" id="tipo" name="tipo" required>
                    </div>
                    <hr>
                    <div class="form-group">
                        <label for="intention">Intenção:</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" value="usuario" id="intention1" name="intention[]">
                            <label class="form-check-label" for="intention1">Usuario</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" value="supervisor" id="intention2" name="intention[]">
                            <label class="form-check-label" for="intention2">Supervisor</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" value="profissional" id="intention3" name="intention[]">
                            <label class="form-check-label" for="intention3">Profissional</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" value="estagiario" id="intention4" name="intention[]">
                            <label class="form-check-label" for="intention4">Estagiario</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-outline-dark">Cadastrar</button>
                    <a href="{% url 'login' %}" class="btn btn-link">Login</a>
                </form>
            </div>
        </div>
    </div>
    </body>
</html>
